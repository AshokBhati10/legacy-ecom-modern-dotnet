<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Northwind Market</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/jquery-ui/all.css" />
    <link rel="stylesheet" href="css/jquery.fancybox.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="account">
    <div id="site-header"></div>

    <div class="container body-content">
        <div class="auth-wrap">
            <div class="auth-card">
                <h2>Create your account</h2>
                <p class="text-muted">Track orders, save your cart, and check out faster.</p>
                <div class="alert alert-danger validation-summary-errors hidden" id="register-errors" role="alert"></div>
                <form id="register-form" method="post" novalidate>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label for="FirstName">First name</label>
                                <input type="text" id="FirstName" name="FirstName" class="form-control" data-val="true" data-val-required="First name is required." />
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="form-group">
                                <label for="LastName">Last name</label>
                                <input type="text" id="LastName" name="LastName" class="form-control" data-val="true" data-val-required="Last name is required." />
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="Email">Email</label>
                        <input type="email" id="Email" name="Email" class="form-control" placeholder="you@example.com" data-val="true" data-val-required="Email is required." data-val-email="Enter a valid email address." />
                    </div>
                    <div class="form-group">
                        <label for="Password">Password</label>
                        <input type="password" id="Password" name="Password" class="form-control" placeholder="At least 6 characters" data-val="true" data-val-required="Password is required." data-val-minlength="Password must be at least 6 characters." data-val-minlength-min="6" />
                    </div>
                    <div class="form-group">
                        <label for="ConfirmPassword">Confirm password</label>
                        <input type="password" id="ConfirmPassword" name="ConfirmPassword" class="form-control" data-val="true" data-val-required="Please confirm your password." data-val-equalto="The password and confirmation password do not match." data-val-equalto-other="*.Password" />
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block">Create account</button>
                    <p class="text-center" style="margin-top:16px">Already have an account? <a href="login.html">Log in</a></p>
                </form>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/jquery-ui-1.12.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.validate.min.js"></script>
    <script src="js/jquery.validate.unobtrusive.min.js"></script>
    <script src="js/jquery.unobtrusive-ajax.min.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
