<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Northwind Market</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/jquery-ui/all.css" />
    <link rel="stylesheet" href="css/jquery.fancybox.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="account">
    <div id="site-header"></div>

    <div class="container body-content">
        <h2>Register</h2>
        <p class="text-muted">Create a new account.</p>
        <div class="alert alert-danger validation-summary-errors hidden" id="register-errors" role="alert"></div>
        <form id="register-form" class="form-horizontal" method="post" novalidate>
            <div class="form-group">
                <label class="col-md-2 control-label" for="FirstName">First name</label>
                <div class="col-md-6"><input type="text" id="FirstName" name="FirstName" class="form-control" data-val="true" data-val-required="First name is required." /></div>
            </div>
            <div class="form-group">
                <label class="col-md-2 control-label" for="LastName">Last name</label>
                <div class="col-md-6"><input type="text" id="LastName" name="LastName" class="form-control" data-val="true" data-val-required="Last name is required." /></div>
            </div>
            <div class="form-group">
                <label class="col-md-2 control-label" for="Email">Email</label>
                <div class="col-md-6"><input type="email" id="Email" name="Email" class="form-control" data-val="true" data-val-required="Email is required." data-val-email="Enter a valid email address." /></div>
            </div>
            <div class="form-group">
                <label class="col-md-2 control-label" for="Password">Password</label>
                <div class="col-md-6"><input type="password" id="Password" name="Password" class="form-control" data-val="true" data-val-required="Password is required." data-val-minlength="Password must be at least 6 characters." data-val-minlength-min="6" /></div>
            </div>
            <div class="form-group">
                <label class="col-md-2 control-label" for="ConfirmPassword">Confirm password</label>
                <div class="col-md-6"><input type="password" id="ConfirmPassword" name="ConfirmPassword" class="form-control" data-val="true" data-val-required="Please confirm your password." data-val-equalto="The password and confirmation password do not match." data-val-equalto-other="*.Password" /></div>
            </div>
            <div class="form-group">
                <div class="col-md-offset-2 col-md-6"><button type="submit" class="btn btn-primary">Register</button></div>
            </div>
        </form>
    </div>

    <div id="site-footer"></div>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/jquery-ui-1.12.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.validate.min.js"></script>
    <script src="js/jquery.validate.unobtrusive.min.js"></script>
    <script src="js/jquery.unobtrusive-ajax.min.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
