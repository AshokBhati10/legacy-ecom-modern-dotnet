<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Northwind Market</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/jquery-ui/all.css" />
    <link rel="stylesheet" href="css/jquery.fancybox.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="catalog">
    <div id="site-header"></div>

    <div class="container body-content">
        <h2>Products</h2>
        <div class="row">
            <div class="col-md-3">
                <div class="panel panel-default">
                    <div class="panel-heading"><h4 class="panel-title">Categories</h4></div>
                    <div class="panel-body">
                        <ul class="nav nav-pills nav-stacked" id="category-tree">
                            <li class="cat-all active"><a href="#" data-cat-id="">All products</a></li>
                        </ul>
                    </div>
                </div>
                <div class="panel panel-default">
                    <div class="panel-heading"><h4 class="panel-title">Filter</h4></div>
                    <div class="panel-body">
                        <form id="product-filter-form" method="get">
                            <div class="form-group">
                                <label for="filter-q">Search</label>
                                <input type="text" id="filter-q" name="q" class="form-control" placeholder="Keywords..." />
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Apply filter</button>
                            <button type="button" class="btn btn-link btn-block" id="filter-clear">Clear</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <p class="text-muted" id="product-count"></p>
                <div id="product-list" class="row">
                    <div class="col-xs-12"><p class="text-muted">Loading products&hellip;</p></div>
                </div>
                <nav class="text-center"><ul class="pagination" id="product-pager"></ul></nav>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/jquery-ui-1.12.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.validate.min.js"></script>
    <script src="js/jquery.validate.unobtrusive.min.js"></script>
    <script src="js/jquery.unobtrusive-ajax.min.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/home.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
