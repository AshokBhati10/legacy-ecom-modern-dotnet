<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Northwind Market</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/jquery-ui/all.css" />
    <link rel="stylesheet" href="css/jquery.fancybox.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="account">
    <div id="site-header"></div>

    <div class="container body-content">
        <div class="auth-wrap">
            <div class="auth-card">
                <h2>Welcome back</h2>
                <p class="text-muted">Log in to track orders and check out faster.</p>
                <div class="alert alert-danger validation-summary-errors hidden" id="login-errors" role="alert"></div>
                <form id="login-form" method="post" novalidate>
                    <div class="form-group">
                        <label for="Email">Email</label>
                        <input type="email" id="Email" name="Email" class="form-control" placeholder="you@example.com" data-val="true" data-val-required="Email is required." data-val-email="Enter a valid email address." />
                    </div>
                    <div class="form-group">
                        <label for="Password">Password</label>
                        <input type="password" id="Password" name="Password" class="form-control" placeholder="••••••••" data-val="true" data-val-required="Password is required." />
                    </div>
                    <div class="checkbox"><label><input type="checkbox" id="RememberMe" name="RememberMe" /> Remember me</label></div>
                    <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
                    <p class="text-center" style="margin-top:16px">New here? <a href="register.html">Create an account</a></p>
                </form>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/jquery-ui-1.12.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.validate.min.js"></script>
    <script src="js/jquery.validate.unobtrusive.min.js"></script>
    <script src="js/jquery.unobtrusive-ajax.min.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
